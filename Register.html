<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>

    <link rel="stylesheet" href="css/stylesheet.css">
    <link rel="stylesheet" href="css/register.css">

</head>
<body>

    <form action="">

        <legend>Join Us and Start Your Journey Today!!!</legend> <br>

        <label for="fanme"> Surname : </label>
        <input type="text" placeholder="Enter Surname" id="sname" required> <br><br>
    
        <label for="email"> Email Address: </label>
        <input type="email" placeholder="Enter Email" id="fname" required> <br><br>

        <label for="fname"> firstname: </label>
        <input type="fname" placeholder="Enter Firstname" id="fname" required> <br><br>

        <label for="pwd"> Password: </label>
        <input type="pwd" placeholder=" Type password" id="pwd" required> <br><br>

        <label for="phone"> Phone Number: </label>
        <input type="tel" placeholder="e.g 07123435678" id="phone" required> <br><br>

        <label for="yob"> Year of Birth: </label>
        <input type="date" id="yob" required> <br><br>

         <label for="dt"> Date and Time: </label>
        <input type="datetime-local" id="dt" required> <br><br>

        <label for="dt"> Upload File: </label>
        <input type="file" id="File" required> <br><br>

        <label for="nationality"> Select Nationality: </label>
        <!---dropdown-->

        <select name="" id="nationality">

            <option value="" disabled>--Choose One --</option>
            <option value="">American</option>
            <option value="">Spanish</option>
            <option value="">Kenyan</option>
            <option value="">Canadian</option>




        </select>


        <!---End of Dropdown-->

        <br><br>

        <label>Select Gender</label> <br>

        <input type="radio" id="male" name="gender">
        <label for="">Male</label> <br>

        <input type="radio" id="female" name="gender">
        <label for="female">female</label> <br>

         <input type="radio" id="other" name="gender">
        <label for="other">other</label> <br>

        <br>

        <label>Choose Web Programming Languages</label> <br>

        <input type="checkbox" id="php" name="php">
        <label for="php">PHP</label> <br>

         <input type="checkbox" id="python" name="python">
        <label for="python">Python</label> <br>

         <input type="checkbox" id="swift" name="swift">
        <label for="swift">Swift</label> <br><br>

        <label for="message">Message</label> <br>
        <textarea name="" id="" cols="70" rows="20"  placeholder="type here..."></textarea>

        <br><br>

        <button type="submit">Regesiter</button>

    </form>
    
</body>
</html>
