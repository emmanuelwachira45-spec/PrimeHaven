<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" href="Images/Table.png">
    <title>Table Page</title>

    <style>
        table{
            border-collapse: collapse;
            font-family: Arial, Helvetica, sans-serif;
        }

        th, td{
            border: 1px solid black;
            padding: 10px 20px;
            text-align: center;
        }

        th{
            background-color: #f0f0f0;
        }

    </style>

</head>
<body>
    <h1>Subject Table</h1>

    <table>
        <tr>
            <th colspan="2">Subject</th>
            <th>John Doe</th>
            <th>Miriam Luther</th>
        </tr>

        <tr>
            <td rowspan="2">Biology</td>
            <td>Practical</td>
            <td>A</td>
            <td>A</td>
        </tr>
        
        <tr>
            <td>Theory</td>
            <td>A+</td>
            <td>A</td>
        </tr>

        <tr>
            <td rowspan="2">Chemistry</td>
            <td>Practical</td>
            <td>B</td>
            <td>C</td>
        </tr>

        <tr>
            <td>Theory</td>
            <td>A</td>
            <td>C+</td>
        </tr>

        <tr>
            <td rowspan="2">Physics</td>
            <td>Practical</td>
            <td>A</td>
            <td>A</td>
        </tr>

        <tr>
            <td>Theory</td>
            <td>A-</td>
            <td>A-</td>
        </tr>

    </table>
    
</body>
</html>
